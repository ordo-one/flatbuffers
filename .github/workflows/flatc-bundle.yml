name: flatc bundle

on:
    workflow_dispatch:
    push:
        tags:
            # only the prerelease tags semantic-release cuts on `next`, never a master or upstream tag
            - "*-ordo.*"

permissions:
    contents: write

jobs:
    macos:
        runs-on: macos-latest
        name: macOS (arm64)
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: cmake
                run: cmake -G "Xcode" -DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_STRICT_MODE=ON .

            -   name: Build
                run: xcodebuild -toolchain clang -configuration Release -target flatc

            -   name: Check architecture
                run: file Release/flatc | grep "Mach-O 64-bit executable arm64"

            -   name: Version
                run: |
                    chmod +x Release/flatc
                    Release/flatc --version

            -   name: Bundle
                env:
                    BINARY: Release/flatc
                    PLATFORM: darwin-arm64
                    TRIPLE: arm64-apple-macosx
                run: |
                    set -euo pipefail

                    # the ordo tag carries a `v` and may carry an `-ordo.N` suffix; neither belongs in info.json
                    version="${GITHUB_REF_NAME#v}"
                    version="${version%%-ordo*}"

                    # stable across releases, so the consumer's asset lookup does not change every tag
                    bundle="${PLATFORM}.artifactbundle"

                    mkdir -p "${bundle}/flatc/bin"
                    cp "$BINARY" "${bundle}/flatc/bin/${PLATFORM}-flatc"
                    chmod +x "${bundle}/flatc/bin/${PLATFORM}-flatc"

                    sed -e "s|__VERSION__|${version}|g" \
                        -e "s|__PLATFORM__|${PLATFORM}|g" \
                        -e "s|__TRIPLE__|${TRIPLE}|g" \
                        .github/info.json > "${bundle}/info.json"

                    zip -r -q "${bundle}.zip" "${bundle}"

            -   name: Upload
                uses: actions/upload-artifact@v7
                with:
                    name: bundle-darwin-arm64
                    path: '*.artifactbundle.zip'
                    compression-level: 0
                    retention-days: 1
                    overwrite: true

    linux:
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   runner: ubuntu-24.04
                        platform: linux-x86_64
                        triple: x86_64-unknown-linux-gnu
#                    -   runner: ubuntu-24.04-arm
#                        platform: linux-aarch64
#                        triple: aarch64-unknown-linux-gnu

        runs-on: ${{ matrix.runner }}
        name: Linux (${{ matrix.platform }})
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: cmake
                run: CXX=clang++-18 cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_STRICT_MODE=ON -DFLATBUFFERS_STATIC_FLATC=ON .

            -   name: Build
                run: make -j flatc

            -   name: Version
                run: |
                    chmod +x flatc
                    ./flatc --version

            -   name: Bundle
                env:
                    BINARY: flatc
                    PLATFORM: ${{ matrix.platform }}
                    TRIPLE: ${{ matrix.triple }}
                run: |
                    set -euo pipefail

                    # the ordo tag carries a `v` and may carry an `-ordo.N` suffix; neither belongs in info.json
                    version="${GITHUB_REF_NAME#v}"
                    version="${version%%-ordo*}"

                    # stable across releases, so the consumer's asset lookup does not change every tag
                    bundle="${PLATFORM}.artifactbundle"

                    mkdir -p "${bundle}/flatc/bin"
                    cp "$BINARY" "${bundle}/flatc/bin/${PLATFORM}-flatc"
                    chmod +x "${bundle}/flatc/bin/${PLATFORM}-flatc"

                    sed -e "s|__VERSION__|${version}|g" \
                        -e "s|__PLATFORM__|${PLATFORM}|g" \
                        -e "s|__TRIPLE__|${TRIPLE}|g" \
                        .github/info.json > "${bundle}/info.json"

                    zip -r -q "${bundle}.zip" "${bundle}"

            -   name: Upload
                uses: actions/upload-artifact@v7
                with:
                    name: bundle-${{ matrix.platform }}
                    path: '*.artifactbundle.zip'
                    compression-level: 0
                    retention-days: 1
                    overwrite: true

    release:
        runs-on: ubuntu-latest
        needs: [macos, linux]
        name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        steps:
            -   name: Download bundles
                uses: actions/download-artifact@v7
                with:
                    path: release-artifacts
                    pattern: bundle-*
                    merge-multiple: true

            -   name: Create GitHub release
                uses: softprops/action-gh-release@v2
                id: create_release
                with:
                    files: release-artifacts/*.artifactbundle.zip
                    generate_release_notes: true

            -   name: Report urls and checksums
                run: |
                    ASSETS_JSON='${{ steps.create_release.outputs.assets }}'

                    {
                        echo "## Scripts/bundles/Package.swift"
                        echo
                        echo '| platform | url | checksum |'
                        echo '| --- | --- | --- |'
                    } >> "$GITHUB_STEP_SUMMARY"

                    for zip in release-artifacts/*.artifactbundle.zip; do
                        name=$(basename "$zip")
                        checksum=$(sha256sum "$zip" | cut -d' ' -f1)

                        # SwiftPM infers the archive type from the extension, so the bare asset API url needs `.zip`
                        url="$(jq -r --arg n "$name" '.[] | select(.name == $n) | .url' <<< "$ASSETS_JSON").zip"

                        # canary: the asset must be fetchable before the checksum is worth pasting
                        curl -sf -L -H "Accept: application/octet-stream" \
                            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                            -o /dev/null "$url"

                        echo "| ${name%%.artifactbundle.zip} | \`$url\` | \`$checksum\` |" >> "$GITHUB_STEP_SUMMARY"
                    done
